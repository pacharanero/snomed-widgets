version = 1

[[annotations]]
path = [
    "**/*.md",
    "**/*.txt",
    "**/*.json",
    "**/*.html",
    "**/*.csv",
    "**/*.lock",
    "LICENSE",
    ".gitignore",
    ".editorconfig",
]
precedence = "aggregate"
